[project]
name = "gopay"
version = "0.1.0"
description = "Go Pay : API de transfert d'argent (TD1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "strawberry-graphql>=0.341.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-grpcio>=1.85.0.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gopay"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/gopay/fraude/fraud_pb2*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gopay.fraude.fraud_pb2", "gopay.fraude.fraud_pb2_grpc"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["gopay.fraude.serveur", "gopay.fraude.client"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
pythonpath = ["."]